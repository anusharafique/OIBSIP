<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB color slider</title>
    <link rel="stylesheet" href='https://fonts.googleapis.com/
    css2?family=Work+Sans.eght@500&display=swap'>
    <link rel="stylesheet" href="./rgb.css">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            R<input type="range" min="0" max="255" value="0" id="red"
            oninput="colors()">
        </div>
         <div class="wrapper">
            G<input type="range" min="0" max="255" value="0" id="green"
            oninput="colors()">
        </div>
         <div class="wrapper">
            B<input type="range" min="0" max="255" value="0" id="blue"
            oninput="colors()">
        </div>
        <span id="output">rgb(0,0,0)</span>

        <script src="./rgb.js"></script>
    </div>
</body>
</html>
